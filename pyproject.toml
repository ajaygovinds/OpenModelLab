[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmodellab"
version = "0.4.0"
description = "Standardized inspection framework for open AI models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ajay Govind S" }
]

dependencies = [
    "torch==2.6.0",
    "transformers>=4.57.1",
    "datasets",
    "sentence-transformers",
    "huggingface-hub"
]

[tool.setuptools]
packages = [
    "openmodellab",
    "openmodellab.genome",
    "openmodellab.genome.inspectors",
    "openmodellab.cli",
    "openmodellab.comparison",
    "openmodellab.reporting",
    "openmodellab.visualization",
    "openmodellab.auditor",
    "openmodellab.common"
]

[project.scripts]
openmodellab = "openmodellab.cli.main:main"
