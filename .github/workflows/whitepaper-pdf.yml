name: Build Whitepaper PDF

on:
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Build PDF
        run: |
          pandoc paper/OpenModelLab_Whitepaper.md \
            -o paper/OpenModelLab_Whitepaper.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V fontsize=11pt

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: OpenModelLab-Whitepaper-v0.4.0
          path: paper/OpenModelLab_Whitepaper.pdf
